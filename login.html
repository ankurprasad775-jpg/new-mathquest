<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>MathQuest | Login</title>

    <link
        rel="stylesheet"
        href="login.css">

</head>

<body>

    <!-- Cinematic Background -->

    <div class="scene">

        <div class="lamp">

            <div class="lamp-shade"></div>

            <div class="lamp-bulb"></div>

        </div>


        <div class="light-glow"></div>


        <div class="equations">

            <span>sin² x + cos² x = 1</span>

            <span>ax² + bx + c = 0</span>

            <span>tan θ = sin θ / cos θ</span>

            <span>πr²</span>

        </div>


        <div class="books">

            <div>ALGEBRA</div>

            <div>TRIGONOMETRY</div>

            <div>QUADRATIC EQUATIONS</div>

        </div>

    </div>


    <!-- Login -->

    <main class="login-wrapper">

        <div class="login-card">


            <!-- Logo -->

            <div class="logo-box">

                <div class="sigma">
                    Σ
                </div>

                <h1>
                    Math<span>Quest</span>
                </h1>

            </div>


            <p class="tagline">

                Learn Mathematics.
                Build Your Future.

            </p>


            <div class="small-line"></div>


            <h2>
                Welcome Back! 👋
            </h2>


            <!-- Form -->

            <form id="loginForm">


                <div class="input-box">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="input-box">

                    <label>
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            
                            required>

                        <button
                            type="button"
                            id="togglePassword">

                            👁

                        </button>

                    </div>

                </div>


                <div class="login-options">

                

                


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-button">

                    LOGIN

                    <span>→</span>

                </button>


            </form>


            <div class="divider">

                <span></span>

                <b>OR</b>

                <span></span>

            </div>


            <p class="signup">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>


            <p class="quote">

                "Mathematics is the language
                of the universe."

                <br>

                <span>— Galileo Galilei</span>

            </p>

        </div>

    </main>


    <script src="login.js"></script>

</body>

</html>
