<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>MathQuest | Create Account</title>

    <link
        rel="stylesheet"
        href="signup.css">

</head>


<body>


    <!-- =================================
         CINEMATIC BACKGROUND
    ================================= -->

    <div class="scene">


        <!-- Lamp -->

        <div class="lamp">

            <div class="lamp-shade"></div>

            <div class="lamp-bulb"></div>

        </div>


        <div class="light-glow"></div>


        <!-- Mathematical Equations -->

        <div class="equations">

            <span>
                x² + 5x + 6 = 0
            </span>

            <span>
                sin²θ + cos²θ = 1
            </span>

            <span>
                A = πr²
            </span>

            <span>
                a² + b² = c²
            </span>

        </div>


        <!-- Books -->

     <!-- <div class="books">

            <div>
                ALGEBRA
            </div>

            <div>
                TRIGONOMETRY
            </div>
         <div>
              
            </div>

         </div>

        -->

    <!-- =================================
         SIGNUP
    ================================= -->

    <main class="signup-wrapper">


        <div class="signup-card">


            <!-- Logo -->

            <div class="logo-box">

                <div class="sigma">
                    Σ
                </div>


                <h1>
                    Math<span>Quest</span>
                </h1>

            </div>


            <p class="tagline">

                Start your mathematics
                journey today.

            </p>


            <div class="small-line"></div>


            <h2>
                Create Your Account 🚀
            </h2>



            <!-- FORM -->

            <form id="signupForm">


                <!-- NAME -->

                <div class="input-box">

                    <label>
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your name"
                        required>

                </div>



                <!-- EMAIL -->

                <div class="input-box">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required>

                </div>



                <!-- PASSWORD -->

                <div class="input-box">

                    <label>
                        Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                            required>


                        <button
                            type="button"
                            id="togglePassword">

                            👁

                        </button>

                    </div>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="input-box">

                    <label>
                        Confirm Password
                    </label>


                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required>

                </div>



                <!-- TERMS -->

                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required>

                    <span>
                        I agree to the
                        <a href="#">
                            Terms & Conditions
                        </a>
                    </span>

                </label>



                <!-- CREATE BUTTON -->

                <button
                    type="submit"
                    class="signup-button">

                    CREATE ACCOUNT

                    <span>
                        →
                    </span>

                </button>


            </form>



            <!-- DIVIDER -->

            <div class="divider">

                <span></span>

                <b>OR</b>

                <span></span>

            </div>



            <!-- LOGIN -->

            <p class="login-text">

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </p>



            <!-- QUOTE -->

            <p class="quote">

                "The beautiful thing about
                mathematics is that it never ends."

                <br>

                <span>
                    Keep learning. Keep solving.
                </span>

            </p>


        </div>

    </main>


    <script src="signup.js"></script>

</body>

</html>
